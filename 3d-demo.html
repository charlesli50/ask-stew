<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stew 3D Demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd6e7; font-family: ui-rounded, system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; left: 0; right: 0; bottom: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 16px; }
  button { font: inherit; font-size: 16px; font-weight: 700; padding: 10px 18px; border: 0; border-radius: 999px;
           background: #fff; color: #2d5fa8; box-shadow: 0 4px 0 #f3a9c6; cursor: pointer; }
  button.on { background: #2d5fa8; color: #fff; box-shadow: 0 4px 0 #1b3d70; }
  #title { position: fixed; top: 16px; left: 0; right: 0; text-align: center; color: #2d5fa8; font-weight: 800; font-size: 22px; }
  #hint { position: fixed; top: 46px; left: 0; right: 0; text-align: center; color: #b4588a; font-size: 13px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #2d5fa8; font-weight: 700; }
</style>
</head>
<body>
<div id="title">Stew 3D 🐮💙</div>
<div id="hint">drag to spin · scroll / pinch to zoom</div>
<div id="loading">loading Stew…</div>
<div id="ui">
  <button data-mode="idle" class="on">Idle</button>
  <button data-mode="ponder">Ponder</button>
  <button data-mode="moo">Moo</button>
  <button data-mode="dance">Dance 🎵</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 5.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.5; controls.maxDistance = 10;

// Default look. Tweak with the sliders, then hit "Copy settings" and paste them here.
const look = {
  exposure: 1.0,
  ambient: 1.5,      // hemisphere light (sky white, ground pink)
  frontLight: 0.8,   // fill light from the camera side
  sunLight: 2.0,     // main light from above-right (casts the shadow)
  studio: 0.5,       // soft all-around reflection light
  roughness: 1.0,    // 1 = matte fabric, lower = shinier
  shadow: 0.18,
  // color
  tint: '#ffffff',       // multiplies all of Stew (white = original colors)
  saturation: 1.0,       // 0 = black & white, 1 = original, 2 = extra vivid
  recolorSpots: false,
  spotColor: '#e85d9e',  // the new color for his blue spots
  rainbow: false,        // spots cycle through every color (extra wild while dancing)
  // motion
  bpm: 112,              // dance speed (also the beat)
  bounce: 1.0,           // how high he hops
  sway: 1.0,             // how far he wiggles side to side
  size: 1.0,
  // scene
  background: '#ffd6e7',
  autoRotate: false,
};

renderer.toneMappingExposure = look.exposure;
// soft studio-style light from all directions
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const hemi = new THREE.HemisphereLight(0xffffff, 0xffc0d8, look.ambient);
scene.add(hemi);
const front = new THREE.DirectionalLight(0xffffff, look.frontLight);
front.position.set(0, 2, 6);
scene.add(front);
const sun = new THREE.DirectionalLight(0xffffff, look.sunLight);
sun.position.set(2, 5, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// soft shadow-catching floor
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.ShadowMaterial({ opacity: look.shadow }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);

// rig: pivot sits at Stew's feet so squash & stretch looks grounded
const pivot = new THREE.Group();
scene.add(pivot);

const stewMaterials = [];

// ---------- color shader bits ----------
// Stew's spots in the texture are blue (hue ≈ 0.6, sat ≈ 0.37, value ≈ 0.51 in normal sRGB).
// We find those pixels in the shader and swap their hue for the picked color.
const SPOT_REF = { s: 0.37, v: 0.51 };
const colorUniforms = {
  uSpotOn: { value: 0 }, uSpotHue: { value: 0 }, uSpotSat: { value: 1 }, uSpotVal: { value: 1 },
  uSaturation: { value: 1 },
};
const GLSL_HELPERS = /* glsl */`
uniform float uSpotOn, uSpotHue, uSpotSat, uSpotVal, uSaturation;
vec3 rgb2hsv(vec3 c){ vec4 K=vec4(0.,-1./3.,2./3.,-1.); vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));
  vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r)); float d=q.x-min(q.w,q.y); float e=1e-10;
  return vec3(abs(q.z+(q.w-q.y)/(6.*d+e)),d/(q.x+e),q.x); }
vec3 hsv2rgb(vec3 c){ vec4 K=vec4(1.,2./3.,1./3.,3.); vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);
  return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y); }
`;
const MAP_FRAGMENT = /* glsl */`
#ifdef USE_MAP
  vec4 sampledDiffuseColor = texture2D( map, vMapUv );
  vec3 srgb = pow( max( sampledDiffuseColor.rgb, 0.0 ), vec3( 1.0 / 2.2 ) );
  vec3 hsv = rgb2hsv( srgb );
  float hueDist = abs( hsv.x - 0.6 );
  float spot = smoothstep( 0.15, 0.28, hsv.y ) * ( 1.0 - smoothstep( 0.06, 0.1, hueDist ) );
  vec3 newSpot = hsv2rgb( vec3( uSpotHue,
      clamp( hsv.y * uSpotSat / ${SPOT_REF.s.toFixed(2)}, 0.0, 1.0 ),
      clamp( hsv.z * uSpotVal / ${SPOT_REF.v.toFixed(2)}, 0.0, 1.0 ) ) );
  srgb = mix( srgb, newSpot, spot * uSpotOn );
  float lum = dot( srgb, vec3( 0.299, 0.587, 0.114 ) );
  srgb = clamp( mix( vec3( lum ), srgb, uSaturation ), 0.0, 1.0 );
  diffuseColor *= vec4( pow( srgb, vec3( 2.2 ) ), sampledDiffuseColor.a );
#endif
`;
function setSpotColor(hex) {
  const c = new THREE.Color(hex), rgb = {};
  c.getRGB(rgb, THREE.SRGBColorSpace);
  const max = Math.max(rgb.r, rgb.g, rgb.b), min = Math.min(rgb.r, rgb.g, rgb.b), d = max - min;
  let h = 0;
  if (d) h = max === rgb.r ? ((rgb.g - rgb.b) / d) % 6 : max === rgb.g ? (rgb.b - rgb.r) / d + 2 : (rgb.r - rgb.g) / d + 4;
  colorUniforms.uSpotHue.value = ((h / 6) + 1) % 1;
  colorUniforms.uSpotSat.value = max ? d / max : 0;
  colorUniforms.uSpotVal.value = max;
}
setSpotColor(look.spotColor);

// ---------- sliders ----------
const gui = new GUI({ title: 'Stew controls' });
const fLight = gui.addFolder('💡 Lighting');
fLight.add(look, 'exposure', 0.2, 2.5, 0.05).name('Overall brightness').onChange(v => renderer.toneMappingExposure = v);
fLight.add(look, 'ambient', 0, 4, 0.05).name('Ambient light').onChange(v => hemi.intensity = v);
fLight.add(look, 'frontLight', 0, 4, 0.05).name('Front light').onChange(v => front.intensity = v);
fLight.add(look, 'sunLight', 0, 5, 0.05).name('Sun light').onChange(v => sun.intensity = v);
fLight.add(look, 'studio', 0, 2, 0.05).name('Studio glow').onChange(v => stewMaterials.forEach(m => m.envMapIntensity = v));
fLight.add(look, 'roughness', 0, 1, 0.01).name('Matte ↔ shiny').onChange(v => stewMaterials.forEach(m => m.roughness = v));
fLight.add(look, 'shadow', 0, 0.6, 0.01).name('Shadow').onChange(v => floor.material.opacity = v);

const fColor = gui.addFolder('🎨 Color');
fColor.addColor(look, 'tint').name('Overall tint').onChange(v => stewMaterials.forEach(m => m.color.set(v)));
fColor.add(look, 'saturation', 0, 2, 0.01).name('Saturation').onChange(v => colorUniforms.uSaturation.value = v);
fColor.add(look, 'recolorSpots').name('Recolor spots').onChange(v => colorUniforms.uSpotOn.value = v ? 1 : 0);
fColor.addColor(look, 'spotColor').name('Spot color').onChange(v => {
  setSpotColor(v);
  if (!look.recolorSpots) { look.recolorSpots = true; colorUniforms.uSpotOn.value = 1; gui.controllersRecursive().forEach(c => c.updateDisplay()); }
});
fColor.add(look, 'rainbow').name('🌈 Rainbow spots').onChange(v => { if (!v) { setSpotColor(look.spotColor); colorUniforms.uSpotOn.value = look.recolorSpots ? 1 : 0; } });

const fMove = gui.addFolder('🕺 Motion');
fMove.add(look, 'bpm', 60, 180, 1).name('Dance speed (BPM)');
fMove.add(look, 'bounce', 0, 3, 0.05).name('Bounce height');
fMove.add(look, 'sway', 0, 3, 0.05).name('Sway');
fMove.add(look, 'size', 0.4, 1.6, 0.01).name('Size');

const fScene = gui.addFolder('🌸 Scene');
const applyBg = v => document.body.style.background = v;
fScene.addColor(look, 'background').name('Background').onChange(applyBg);
fScene.add(look, 'autoRotate').name('Auto-rotate camera').onChange(v => controls.autoRotate = v);
fScene.close(); fMove.close();
gui.add({ copy() {
  const text = JSON.stringify(look, null, 2);
  navigator.clipboard.writeText(text).then(() => alert('Copied!\n\n' + text), () => prompt('Copy these:', text));
} }, 'copy').name('📋 Copy settings');
gui.add({ reset() { gui.reset(); } }, 'reset').name('↺ Reset');
if (innerWidth < 600) gui.close();

new GLTFLoader().load('assets/stew.glb', gltf => {
  const model = gltf.scene;
  model.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    // AI models often come out slightly metallic, which renders dark without reflections.
    // Stew is fabric: no metal, fully matte.
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!('metalness' in m)) return;
      m.metalness = 0; m.metalnessMap = null; m.roughnessMap = null;
      m.roughness = look.roughness; m.envMapIntensity = look.studio; m.color.set(look.tint);
      m.onBeforeCompile = shader => {
        Object.assign(shader.uniforms, colorUniforms);
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\n' + GLSL_HELPERS)
          .replace('#include <map_fragment>', MAP_FRAGMENT);
      };
      m.needsUpdate = true;
      stewMaterials.push(m);
    });
  });
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const s = 2 / size.y;                       // make Stew 2 units tall
  model.scale.setScalar(s);
  const c = box.getCenter(new THREE.Vector3());
  model.position.set(-c.x * s, -box.min.y * s, -c.z * s);
  pivot.add(model);
  document.getElementById('loading').remove();
}, undefined, err => { document.getElementById('loading').textContent = 'Could not load Stew 😢 ' + err.message; });

// ---------- moves ----------
// each returns a pose: y (hop), sx/sy (squash), rx/ry/rz (tilt, turn, sway)
const moves = {
  idle: t => ({ y: 0, sy: 1 + Math.sin(t * 2) * 0.015, rx: 0, ry: Math.sin(t * 0.6) * 0.25, rz: Math.sin(t * 1.1) * 0.03 }),
  ponder: t => ({ y: 0, sy: 1, rx: 0.12, ry: Math.sin(t * 0.8) * 0.15, rz: 0.22 + Math.sin(t * 1.6) * 0.06 }),
  moo: t => {
    const k = Math.max(0, Math.sin(t * 7));
    return { y: k * 0.12, sy: 1 + k * 0.1, rx: -k * 0.2, ry: 0, rz: Math.sin(t * 14) * 0.04 };
  },
  dance: (t, b) => {                                 // b = beats so far
    const bounce = Math.abs(Math.sin(Math.PI * b));  // hop once per beat
    const bar = Math.floor(b / 4) % 4;               // change it up every bar
    let ry = Math.sin(Math.PI * b / 2) * 0.6;
    if (bar === 3) ry = ((b % 4) / 4) * Math.PI * 2; // full spin every 4th bar
    return {
      y: bounce * 0.28,
      sy: 1 - (1 - bounce) * 0.14 + bounce * 0.05, // squash on landing, stretch in air
      rx: bar === 1 ? Math.sin(Math.PI * b) * 0.15 : 0, // head-bang bar
      ry,
      rz: Math.sin(Math.PI * b) * 0.22,             // side-to-side sway
    };
  },
};

let mode = 'idle';
const pose = { y: 0, sy: 1, rx: 0, ry: 0, rz: 0 };
const clock = new THREE.Clock();
let t = 0, beats = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  t += dt;
  beats += dt * look.bpm / 60;                     // count beats so speed changes stay smooth
  const target = moves[mode](t, beats);
  target.y *= look.bounce;
  target.rz *= look.sway;
  if (look.rainbow) {
    colorUniforms.uSpotOn.value = 1;
    colorUniforms.uSpotHue.value = (t * 0.25) % 1;
    colorUniforms.uSpotSat.value = 0.75; colorUniforms.uSpotVal.value = 0.85;
  }
  const k = 0.18; // smoothing between moves
  for (const key in pose) {
    // take the short way round when blending out of a spin
    if (key === 'ry') pose.ry += Math.atan2(Math.sin(target.ry - pose.ry), Math.cos(target.ry - pose.ry)) * k;
    else pose[key] += (target[key] - pose[key]) * k;
  }
  pivot.position.y = pose.y;
  const sxz = 1 / Math.sqrt(pose.sy);              // keep volume when squashing
  pivot.scale.set(sxz * look.size, pose.sy * look.size, sxz * look.size);
  pivot.rotation.set(pose.rx, pose.ry, pose.rz);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- a tiny beat so Stew has something to dance to ----------
let audio, beatTimer;
function startBeat() {
  audio ??= new AudioContext();
  let next = audio.currentTime + 0.05;
  const kick = at => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.setValueAtTime(140, at); o.frequency.exponentialRampToValueAtTime(40, at + 0.15);
    g.gain.setValueAtTime(0.6, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.25);
    o.connect(g).connect(audio.destination); o.start(at); o.stop(at + 0.3);
  };
  const hat = at => {
    const buf = audio.createBuffer(1, 2205, 44100), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    f.type = 'highpass'; f.frequency.value = 7000; g.gain.value = 0.15;
    src.buffer = buf; src.connect(f).connect(g).connect(audio.destination); src.start(at);
  };
  beats = 0; // line the dance up with the first beat
  beatTimer = setInterval(() => {
    while (next < audio.currentTime + 0.2) { const spb = 60 / look.bpm; kick(next); hat(next + spb / 2); next += spb; }
  }, 50);
}
function stopBeat() { clearInterval(beatTimer); beatTimer = null; }

document.querySelectorAll('#ui button').forEach(btn => btn.addEventListener('click', () => {
  mode = btn.dataset.mode;
  document.querySelectorAll('#ui button').forEach(b => b.classList.toggle('on', b === btn));
  if (mode === 'dance') { if (!beatTimer) startBeat(); } else stopBeat();
}));
</script>
</body>
</html>

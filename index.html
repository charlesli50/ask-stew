<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Stew Anything</title>
<meta name="description" content="Stew is a cow. Stew knows things. Ask Stew anything.">
<link rel="icon" href="assets/stew-cutout.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffc4dc;
    --pink-deep: #ff8fbf;
    --pink-dark: #d94f8c;
    --blue: #4e6e8a;
    --cream: #fff8ec;
    --ink: #3b2a35;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--pink);
    background-image:
      radial-gradient(circle at 20% 15%, #ffd9e8 0 18%, transparent 19%),
      radial-gradient(circle at 85% 80%, #ffd9e8 0 14%, transparent 15%),
      radial-gradient(circle at 90% 20%, #ffb3d1 0 8%, transparent 9%),
      radial-gradient(circle at 8% 85%, #ffb3d1 0 10%, transparent 11%);
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  h1 {
    margin: clamp(10px, 3dvh, 28px) 16px 0; font-weight: 700; font-size: clamp(26px, min(7vw, 5.5dvh), 44px);
    color: var(--pink-dark); letter-spacing: .5px; text-align: center;
    text-shadow: 3px 3px 0 #fff;
  }
  .sub { margin: 2px 16px 0; color: var(--blue); font-size: clamp(13px, 2.2dvh, 16px); text-align: center; }

  main {
    width: 100%; max-width: 560px; flex: 1; min-height: 0;
    padding: 0 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  /* ---------- Stage ---------- */
  .stage { position: relative; width: fit-content; margin-top: clamp(60px, 11dvh, 100px); flex-shrink: 0; }
  .stew-wrap { position: relative; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; cursor: pointer; }
  .stew {
    display: block; width: auto; max-width: 70vw; object-fit: contain;
    height: clamp(110px, calc(100dvh - 420px), 360px);
    user-select: none; -webkit-user-drag: none;
    transform-origin: 50% 90%;
    animation: sway 5s ease-in-out infinite;
    filter: drop-shadow(0 10px 0 rgba(217,79,140,.18));
  }
  .shadow {
    width: 70%; height: 22px; margin: -14px auto 0; border-radius: 50%;
    background: rgba(217,79,140,.25); animation: shadow 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.025,.975); } }
  @keyframes shadow { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.05); } }
  @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }

  /* pondering: head tilt + slow wobble */
  .stage.pondering .stew { animation: ponder 1.6s ease-in-out infinite; }
  @keyframes ponder { 0%,100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(-3deg) translateY(-4px); } }

  /* mooing: big happy bounce */
  .stage.mooing .stew-wrap { animation: moo .55s cubic-bezier(.3,1.6,.5,1) 3; }
  @keyframes moo {
    0% { transform: scale(1,1); }
    30% { transform: scale(1.08,.9) translateY(4px); }
    60% { transform: scale(.95,1.08) translateY(-18px); }
    100% { transform: scale(1,1); }
  }
  .stew-wrap.boop { animation: boop .4s ease; }
  @keyframes boop { 50% { transform: scale(.94,1.06) rotate(3deg); } }

  /* sparkles around Stew */
  .sparkle { position: absolute; font-size: 22px; pointer-events: none; animation: twinkle 2.4s ease-in-out infinite; }
  .sparkle.s1 { left: -8%; top: 30%; }
  .sparkle.s2 { right: -6%; top: 55%; animation-delay: .8s; }
  .sparkle.s3 { left: 6%; top: 80%; animation-delay: 1.6s; font-size: 16px; }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.7) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(20deg); } }

  /* ---------- Thought bubble ---------- */
  .thought {
    position: absolute; left: 58%; bottom: calc(100% - 14px); z-index: 2;
    opacity: 0; transform: scale(.6); transform-origin: 0% 100%;
    transition: opacity .25s, transform .3s cubic-bezier(.3,1.5,.5,1); pointer-events: none;
  }
  .stage.pondering .thought { opacity: 1; transform: scale(1); }
  .cloud {
    position: relative; width: 140px; padding: 8px 10px 9px; border-radius: 26px;
    background: #fff; color: var(--blue); text-align: center;
    box-shadow: 0 4px 0 rgba(78,110,138,.2);
  }
  .dots { height: 14px; display: flex; justify-content: center; align-items: flex-end; gap: 5px; margin-bottom: 3px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: dot 1s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }
  .ponder-text { font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .puff { position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 3px 0 rgba(78,110,138,.2); }
  .puff.p1 { width: 16px; height: 16px; left: 6px; bottom: -14px; }
  .puff.p2 { width: 9px; height: 9px; left: -6px; bottom: -26px; }

  /* ---------- Moo box ---------- */
  .moo {
    position: relative; width: 100%; margin-top: 16px; min-height: 64px; flex-shrink: 0;
    background: var(--cream); border: 4px solid var(--blue); border-radius: 22px;
    padding: 10px 18px; font-size: clamp(16px, 2.6dvh, 20px); line-height: 1.35; text-align: center;
    box-shadow: 0 6px 0 var(--blue);
    transition: transform .2s;
  }
  .moo::before, .moo::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    border-left: 16px solid transparent; border-right: 16px solid transparent;
  }
  .moo::before { top: -22px; border-bottom: 18px solid var(--blue); }
  .moo::after { top: -14px; border-bottom: 14px solid var(--cream); border-left-width: 12px; border-right-width: 12px; }
  .moo .label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--pink-dark); margin-bottom: 4px; }
  .moo .text { min-height: 1.4em; }
  .moo.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(.92); } 100% { transform: scale(1); } }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); vertical-align: -3px; margin-left: 2px; animation: blink .7s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Input ---------- */
  form { width: 100%; margin-top: clamp(12px, 2.5dvh, 22px); display: flex; gap: 10px; flex-shrink: 0; }
  input {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 18px;
    border: 4px solid #fff; border-radius: 999px; background: #fff; color: var(--ink);
    outline: none; box-shadow: 0 5px 0 var(--pink-deep);
  }
  input:focus { border-color: var(--pink-deep); }
  input::placeholder { color: #c49aae; }
  button {
    font: inherit; font-weight: 700; font-size: 18px; padding: 0 22px; border: none; border-radius: 999px;
    background: var(--pink-dark); color: #fff; cursor: pointer; box-shadow: 0 5px 0 #a8336a;
    transition: transform .1s, box-shadow .1s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #a8336a; }
  button:disabled, input:disabled { opacity: .6; cursor: wait; }


  /* floating hearts / moos */
  .float { position: fixed; pointer-events: none; font-weight: 700; color: var(--pink-dark); animation: floatup 1.8s ease-out forwards; z-index: 10; }
  @keyframes floatup { 0% { opacity: 0; transform: translateY(0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-160px) scale(1.2) rotate(var(--r)); } }


  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <h1>Ask Stew Anything</h1>
  <p class="sub">Stew is a cow. Stew knows things.</p>

  <main>
    <div class="stage" id="stage">
      <div class="thought" aria-hidden="true">
        <div class="cloud">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="ponder-text" id="ponderText">hmm…</div>
          <div class="puff p1"></div><div class="puff p2"></div>
        </div>
      </div>
      <span class="sparkle s1">✨</span>
      <span class="sparkle s2">💙</span>
      <span class="sparkle s3">✨</span>
      <div class="stew-wrap" id="stew" title="boop Stew">
        <img class="stew" src="assets/stew-cutout.png" alt="Stew, a fluffy cream-and-blue cow plush">
      </div>
      <div class="shadow"></div>
    </div>

    <div class="moo" id="moo" aria-live="polite">
      <span class="label">Stew moos</span>
      <div class="text" id="mooText">Moo! Ask me anything.</div>
    </div>

    <form id="form" autocomplete="off">
      <input id="q" type="text" enterkeyhint="send" placeholder="Ask Stew a question…" maxlength="200" aria-label="Your question for Stew">
      <button id="ask" type="submit">Ask</button>
    </form>

  </main>


<script src="stew-dialogue.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), stew = $('stew'), mooBox = $('moo'), mooText = $('mooText'),
        form = $('form'), input = $('q'), btn = $('ask'), ponderText = $('ponderText');

  const S = window.STEW;
  const pick = arr => S.pick(arr);

  // ---- Moo sound (tiny WebAudio synth) ----
  let ctx;
  function mooSound() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = ctx.currentTime, dur = 1.1;
      const out = ctx.createGain();
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(0.35, t + 0.12);
      out.gain.setValueAtTime(0.35, t + dur - 0.35);
      out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 6;
      lp.frequency.setValueAtTime(350, t);
      lp.frequency.linearRampToValueAtTime(900, t + 0.35);
      lp.frequency.linearRampToValueAtTime(500, t + dur);
      lp.connect(out); out.connect(ctx.destination);
      [0, 7].forEach(detune => {
        const o = ctx.createOscillator();
        o.type = 'sawtooth'; o.detune.value = detune;
        o.frequency.setValueAtTime(115, t);
        o.frequency.linearRampToValueAtTime(150, t + 0.3);
        o.frequency.linearRampToValueAtTime(105, t + dur);
        const vib = ctx.createOscillator(), vg = ctx.createGain();
        vib.frequency.value = 5; vg.gain.value = 3;
        vib.connect(vg); vg.connect(o.frequency);
        o.connect(lp); o.start(t); vib.start(t); o.stop(t + dur); vib.stop(t + dur);
      });
    } catch (e) { /* no sound, no problem */ }
  }

  function floaters(texts) {
    const r = stage.getBoundingClientRect();
    texts.forEach((txt, i) => setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'float';
      el.textContent = txt;
      el.style.left = (r.left + r.width * (0.15 + Math.random() * 0.7)) + 'px';
      el.style.top = (r.top + r.height * (0.1 + Math.random() * 0.4)) + 'px';
      el.style.fontSize = (16 + Math.random() * 14) + 'px';
      el.style.setProperty('--r', (Math.random() * 40 - 20) + 'deg');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1900);
    }, i * 140));
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function typeOut(text) {
    mooText.innerHTML = '';
    const span = document.createElement('span'), caret = document.createElement('span');
    caret.className = 'caret';
    mooText.append(span, caret);
    for (const ch of text) {
      span.textContent += ch;
      await sleep(/[.!?…]/.test(ch) ? 160 : 32);
    }
    caret.remove();
  }

  let busy = false;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || busy) return;
    busy = true; input.disabled = btn.disabled = true;

    // 1. ponder
    stage.classList.remove('mooing');
    stage.classList.add('pondering');
    mooText.textContent = '…';
    const ponderTimer = setInterval(() => ponderText.textContent = pick(S.ponders), 900);
    ponderText.textContent = pick(S.ponders);
    await sleep(S.ponderTime.min + Math.random() * (S.ponderTime.max - S.ponderTime.min));
    clearInterval(ponderTimer);

    // 2. think of answer → moo
    const a = S.answer(q);
    stage.classList.remove('pondering');
    void stage.offsetWidth;
    stage.classList.add('mooing');
    mooBox.classList.remove('pop'); void mooBox.offsetWidth; mooBox.classList.add('pop');
    mooSound();
    floaters(S.mooFloaters);
    await typeOut(a);
    setTimeout(() => stage.classList.remove('mooing'), 600);

    input.value = '';
    busy = false; input.disabled = btn.disabled = false;
    if (matchMedia('(pointer: fine)').matches) input.focus();
  });

  if (matchMedia('(pointer: fine)').matches) input.focus();

  stew.addEventListener('click', () => {
    if (busy) return;
    stew.classList.remove('boop'); void stew.offsetWidth; stew.classList.add('boop');
    floaters(S.boopFloaters);
  });
})();
</script>
</body>
</html>
